<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Stylesheets/main.css" type="text/css">
    <script src="scripts/script.js" defer></script>
    <title>Stalcraft Quests</title>
</head>
<body>
    <header>
        <div>
            <h1>STALCRAFT QUEST WIKI</h1>
        </div>
    </header>
    <!---->
    <section class ="main">
        <div class="search-section">
        <div class ="search-wrapper">
            <input class ="search-input" type="search" placeholder ="Search for a Quest" data-search>
        </div>
            <button class="filter-button" filter-toggle>
                <img src="images/Filter.png" alt="Filter Icon">
            </button>
        </div>
        <div class="filter-section" data-filter-search data-visible="false">
            <div class="filter-section-bandit">
                <div class="filter-section-bandit-checkbox">
                    <h1>Bandit</h1>
                    <input type="checkbox" data-filter-bandit faction-visible="false">
                </div>
            </div>
            <div class="filter-section-covenant">
                <div class="filter-section-covenant-checkbox">
                    <h1>Covenant</h1>
                    <input type="checkbox" data-filter-covenant faction-visible="false">
                </div>
            </div>
        </div>
    <!---->
        <div class ="quest-list" data-list-container></div>
        <template data-quest-template>  
            <div class ="quest-boxes-list">
                <div class="quest-box-title">
                        <img class="quest-box-icon" data-logo alt="Bandit Logo" width="100" height="100"/>
                    <span data-header></span>
                </div>
                <div class="quest-box-description" data-body>
                </div>
                <div class="quest-box-link">
                    <a href ="" data-link>Press to read more!</a>
                </div>
            </div>
        </template>
        <!---->
        <ul>
            <li>
                <!-- Page numbers for swapping list -->
            </li>
        </ul>
    </section>
    <!---->
    <footer>
        <div class ="Footer-Details-Left">
            <div class ="Footer-Details-Left-List">
                <p>Contact Details Wiki Creator</p>
            </div>
            <div class ="Footer-Details-Left-List">
                <a>Email:</a>
            </div>
            <div class ="Footer-Details-Left-List">
                <a href ="mailto:KON23006619@heartofyorkshire.ac.uk">KON23006619@heartofyorkshire.ac.uk</a>
            </div>
        </div>
        <!---->
        <div class ="Footer-Details-Right">
            <div class="Footer-Details-Right-List">
                <p>Official Stalcraft Links</p>
            </div>
            <div class="Footer-Details-Right-List">
                <a href ="https://stalcraft.net/">Stalcraft Website</a>
            </div>
            <div class="Footer-Details-Right-List">
                <a href ="https://discord.com/invite/stalcraft-eng">Stalcraft Discord</a>
            </div>
        </div>
    </footer>
</body>
</html>
